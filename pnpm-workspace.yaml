allowBuilds:
  esbuild: true
  webgpu: true

minimumReleaseAgeExclude:
  - '@cluesurf/wash@0.10.0 || 0.10.2 || 0.10.4 || 0.10.6 || 0.10.8 || 0.10.10'

overrides:
  # critical
  shell-quote: '>=1.8.4'
  # high
  'minimatch@<3.1.4': '^3.1.5'
  flatted: '>=3.4.2'
  'picomatch@<2.3.2': '^2.3.2'
  lodash: '>=4.17.24'
  # moderate
  'esbuild@<0.25.0': '>=0.25.0'
  'js-yaml@<4.2.0': '^4.2.0'
  'ajv@<6.14.0': '^6.14.0'
  'brace-expansion@<1.1.13': '^1.1.13'
  # low
  '@eslint/plugin-kit': '>=0.3.4'
  'diff@<4.0.4': '^4.0.4'
