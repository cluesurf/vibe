name = "vibe-theorems"
version = "0.1.0"
keywords = ["math", "physics", "quantum"]
defaultTargets = ["Vibe", "Statements"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Vibe"
roots = ["Vibe"]
# Plain (non-`module`) Vibe files import Mathlib beside the core Vibe files (lean-track.md, Header form).
allowNonModules = true

[[lean_lib]]
name = "Statements"
roots = ["Statements"]
